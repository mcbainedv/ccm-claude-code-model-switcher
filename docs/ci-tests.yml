# GitHub Actions workflow for ccm.
# The gh OAuth token used to publish this repository lacks the `workflow`
# scope, which GitHub requires to push files under .github/workflows/.
# To enable CI on your fork/repository:
#   gh auth refresh -s workflow
#   mkdir -p .github/workflows
#   git mv docs/ci-tests.yml .github/workflows/tests.yml
#   git commit -m "ci: run tests" && git push

name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install fish (integration paths are covered by the tests)
        run: sudo apt-get update && sudo apt-get install -y fish

      - name: Run test suite
        run: python3 -m unittest discover -s tests -v
